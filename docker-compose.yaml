# docker-compose.yaml это «командный центр», он нужен для запуска созданного при выполнении Dockerfile Django-образa
# одновременно с готовыми образами БД PostgreSQL и брокера Redis, настройки между ними связи и запуска Celery-воркеров.

# Указываем версию формата Docker Compose. В современных версиях Docker этот параметр стал устаревшим и необязательным.
#version: '3.9'

# Главный заголовок файла (services). Это сигнал для Docker Compose: «Внимание, ниже начинается список независимых
# программ (контейнеров), которые нужно запустить в рамках единой сети»
# Описываем все независимые сервисы (контейнеры) нашего Django-приложения
services:

  # 1. Сервис базы данных PostgreSQL
  db:
    image: postgres:16-alpine # Используем легкий (alpine) официальный образ Postgres 16
    restart: always # Автоматически перезапускать базу при сбое или перезагрузке системы
    environment:
      POSTGRES_DB: ${DB_NAME} # Имя базы подтягивается из файла .env
      POSTGRES_USER: ${DB_USER} # Имя пользователя из файла .env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Пароль из файла .env
    volumes:
      - pg_data:/var/lib/postgresql/data # Привязываем постоянную флешку, чтобы данные не стирались
    expose:
      - "5432" # Открываем порт строго внутри сети Docker ради безопасности

  # 2. Сервис брокера сообщений Redis
  redis:
    image: redis:7-alpine # Используем легкий (alpine) официальный образ Redis 7
    restart: always
    volumes:
      - redis_data:/data # Сохраняем кэш и очереди задач на постоянном томе
    expose:
      - "6379" # Открываем порт только для упакованного в Dockefile Django-приложения (бэкенда) и Celery внутри Docker

  # 3. Основное Django-приложение
  app:
    build: . # Инструкция Docker: "Найди Dockerfile в текущей папке и собери образ бэкенда (Django-приложения)"
    restart: always
    # Команда для запуска сервера внутри контейнера. Даем команду Django: «Принимай любые запросы, которые приходят
    # к тебе из виртуальной сети Docker Compose».
    command: python manage.py runserver 0.0.0.0:8000 # 0.0.0.0: это «слушать абсолютно все входящие сетевые интерфейсы».
    volumes:
      - .:/app # Связываем папку на компьютере с контейнером, чтобы код обновлялся на лету
      - /app/.venv/ # ИЗОЛЯЦИЯ: локальный .venv не попадет в контейнер
      - /app/.idea/ # ИЗОЛЯЦИЯ: скрывает папки настроек PyCharm/VS Code
      - /app/htmlcov/ # ИЗОЛЯЦИЯ: скрывает отчеты покрытия тестов (если есть)
      - /app/.git/
    ports:
      - "8000:8000" # Прорубаем окно наружу: связываем порт компьютера с портом контейнера
    depends_on:
      - db # Django не запустится, пока не поднимется контейнер с базой данных
      - redis # Django не запустится, пока не поднимется контейнер с Redis
    env_file:
      - .env # Передаем все секретные ключи и настройки из локального файла .env

  # 4. Обработчик фоновых задач Celery Worker
  celery_worker:
    build: . # Использует тот же собранный Docker-образ Django-приложения (бэкенда)
    restart: always
    command: celery -A config worker --loglevel=info --pool=solo # Команда запуска воркера
    volumes:
      - .:/app # Связываем папку на компьютере с контейнером, чтобы код обновлялся на лету
      - /app/.venv/ # ИЗОЛЯЦИЯ: локальный .venv не попадет в контейнер
      - /app/.idea/ # ИЗОЛЯЦИЯ: скрывает папки настроек PyCharm/VS Code
      - /app/htmlcov/ # ИЗОЛЯЦИЯ: скрывает отчеты покрытия тестов (если есть)
      - /app/.git/
    depends_on:
      - redis
      - db
    env_file:
      - .env

  # 5. Периодический планировщик задач Celery Beat
  celery_beat:
    build: . # Также использует общий образ Django-приложения (бэкенда)
    restart: always
    command: celery -A config beat --loglevel=info -s /tmp/celerybeat-schedule # Команда запуска планировщика расписаний
    volumes:
      - .:/app # Связываем папку на компьютере с контейнером, чтобы код обновлялся на лету
      - /app/.venv/ # ИЗОЛЯЦИЯ: локальный .venv не попадет в контейнер
      - /app/.idea/ # ИЗОЛЯЦИЯ: скрывает папки настроек PyCharm/VS Code
      - /app/htmlcov/ # ИЗОЛЯЦИЯ: скрывает отчеты покрытия тестов (если есть)
      - /app/.git/
    depends_on:
      - redis
      - db
    env_file:
      - .env

# Объявляем именованные тома (виртуальные флешки), которые мы использовали выше
volumes:
  pg_data: # Том для хранения файлов базы данных PostgreSQL
  redis_data: # Том для хранения данных Redis
